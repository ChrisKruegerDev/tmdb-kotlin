POM_INCEPTION_YEAR=2026

POM_LICENCE_NAME=The Apache Software License, Version 2.0
POM_LICENCE_URL=http://www.apache.org/licenses/LICENSE-2.0.txt
POM_LICENCE_DIST=repo

POM_URL=https://github.com/ChrisKruegerDev/tmdb-kotlin
POM_SCM_URL=https://github.com/ChrisKruegerDev/tmdb-kotlin
POM_SCM_CONNECTION=scm:git:git@github.com:ChrisKruegerDev/tmdb-kotlin.git
POM_SCM_DEV_CONNECTION=scm:git:git@github.com:ChrisKruegerDev/tmdb-kotlin.git

POM_DEVELOPER_ID=ChrisKruegerDev
POM_DEVELOPER_NAME=Chris Krueger
POM_DEVELOPER_URL=https://github.com/ChrisKruegerDev

mavenCentralAutomaticPublishing=true

